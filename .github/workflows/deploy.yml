name: Deploy to Server

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

  TG_CHAT: ${{ secrets.TELEGRAM_STORAGE_CHAT_ID }}
  TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}

  TG_SUCCESS_MESSAGE: |
    ✅ Has been published
    📝 Commit: ${{ github.event.head_commit.message }}
    👨‍💻 Author: ${{ github.event.head_commit.author.name }}
    🔗 Commit URL: ${{ github.event.head_commit.url }}
    😎 ${{ github.actor }} - GG!
  TG_FAILURE_MESSAGE: |
    ❌ Fail to publish ...
    📝 Commit: ${{ github.event.head_commit.message }}
    👨‍💻 Author: ${{ github.event.head_commit.author.name }}
    🔗 Commit URL: ${{ github.event.head_commit.url }}
    🥺 ${{ github.actor }} - R U OK?

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set lowercase owner 
        run: echo "OWNER_LC=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ env.OWNER_LC }}/bible-bot:latest

  notify:
    needs: build
    runs-on: ubuntu-latest
    steps:
    - name: Send SUCCESS message
      run: |
        curl --header 'Content-Type: application/json' \
             --data '{"chat_id":"${{ env.TG_CHAT }}","text":"${{ env.TG_SUCCESS_MESSAGE }}"}' \
             'https://api.telegram.org/bot${{ env.TG_TOKEN }}/sendMessage'
